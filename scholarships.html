<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#26736b">
  <title>Scholarships | ScholarMatched</title>
  <style>
    :root { --ink: #1a2e2c; --muted: #657572; --teal: #26736b; --line: #e2e9e6; --paper: #f8faf9; --white: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    header { background: var(--white); border-bottom: 1px solid var(--line); }
    .bar { max-width: 1120px; min-height: 68px; margin: auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { color: var(--teal); font-weight: 800; text-decoration: none; font-size: 18px; }
    nav { display: flex; gap: 20px; font-size: 14px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--teal); }
    main { max-width: 1120px; margin: auto; padding: 46px 24px 72px; }
    .heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    h1 { font-size: 34px; margin: 0 0 7px; }
    .heading p { color: var(--muted); margin: 0; }
    .demo-tag { color: #9c4b32; background: #fbede7; padding: 7px 10px; border-radius: 3px; font-weight: 700; font-size: 12px; white-space: nowrap; }
    .filters { display: grid; grid-template-columns: 1fr 220px; gap: 12px; padding: 15px 0 22px; border-top: 1px solid var(--line); }
    input, select { width: 100%; height: 44px; border: 1px solid #d4dfda; border-radius: 4px; background: var(--white); padding: 0 12px; color: var(--ink); font: inherit; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .scholarship { background: var(--white); border: 1px solid var(--line); border-radius: 5px; padding: 20px; display: flex; flex-direction: column; min-height: 220px; }
    .scholarship h2 { font-size: 18px; line-height: 1.35; margin: 0 0 6px; }
    .provider { color: var(--muted); font-size: 13px; }
    .description { color: #465a56; font-size: 14px; line-height: 1.55; margin: 15px 0; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: #45615b; }
    .meta span { background: #eef5f1; padding: 5px 8px; border-radius: 3px; }
    .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 18px; gap: 12px; }
    .deadline { color: var(--muted); font-size: 12px; }
    .save { border: 1px solid var(--teal); color: var(--teal); background: white; padding: 8px 12px; border-radius: 4px; font-weight: 700; cursor: pointer; }
    .save[aria-pressed="true"] { background: var(--teal); color: white; }
    .state { min-height: 25px; color: var(--muted); font-size: 14px; }
    @media (max-width: 640px) { .bar { align-items: flex-start; flex-direction: column; padding: 16px 20px; gap: 12px; } nav { flex-wrap: wrap; gap: 14px; } main { padding: 32px 18px 52px; } .heading { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .filters { grid-template-columns: 1fr; } h1 { font-size: 29px; } }
  </style>
</head>
<body>
  <header><div class="bar"><a class="brand" href="home.html">ScholarMatched</a><nav><a href="home.html">Dashboard</a><a href="profile.html">Profile</a><a href="tracker.html">Application tracker</a><a href="notifications.html">Notifications</a></nav></div></header>
  <main>
    <div class="heading"><div><h1>Scholarships</h1><p>Browse and save opportunities for your study plan.</p></div><span class="demo-tag">Sample data</span></div>
    <div class="filters"><input id="search" type="search" placeholder="Search scholarships, fields, or providers" aria-label="Search scholarships"><select id="country" aria-label="Filter by country"><option value="">All destinations</option><option>Germany</option><option>Netherlands</option><option>United Kingdom</option><option>Sweden</option><option>Canada</option></select></div>
    <div class="state" id="resultState" role="status">Loading sample scholarships...</div>
    <section class="grid" id="scholarshipGrid" aria-live="polite"></section>
  </main>
  <script>
    const savedKey = "scholarMatchedSavedScholarships";
    let scholarships = [];
    function savedScholarships() {
      try { return JSON.parse(localStorage.getItem(savedKey) || "[]"); } catch { return []; }
    }
    function renderScholarships() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const country = document.getElementById("country").value.toLowerCase();
      const rows = scholarships.filter((item) =>
        (!country || String(item.country).toLowerCase() === country) &&
        (!query || [item.scholarship_name, item.provider, item.description, item.field_of_study].join(" ").toLowerCase().includes(query))
      );
      const saved = savedScholarships();
      document.getElementById("resultState").textContent = `${rows.length} sample ${rows.length === 1 ? "scholarship" : "scholarships"}`;
      document.getElementById("scholarshipGrid").innerHTML = rows.map((item) => {
        const id = String(item.scholarship_id);
        const isSaved = saved.includes(id);
        const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
        return `<article class="scholarship"><div><h2>${escape(item.scholarship_name)}</h2><div class="provider">${escape(item.provider)}</div></div><p class="description">${escape(item.description)}</p><div class="meta"><span>${escape(item.country)}</span><span>${escape(item.degree_level)}</span><span>${escape(item.funding_type)}</span></div><div class="bottom"><span class="deadline">Deadline: ${escape(item.application_deadline)}</span><button class="save" type="button" data-save="${escape(id)}" aria-pressed="${isSaved}">${isSaved ? "Saved" : "Save"}</button></div></article>`;
      }).join("");
    }
    async function loadScholarships() {
      try {
        const result = await window.scholarMatchedAuth.api("/api/scholarships?limit=100");
        scholarships = result.data || [];
        renderScholarships();
      } catch (error) {
        document.getElementById("resultState").textContent = error.message;
      }
    }
    document.getElementById("search").addEventListener("input", renderScholarships);
    document.getElementById("country").addEventListener("change", renderScholarships);
    document.getElementById("scholarshipGrid").addEventListener("click", (event) => {
      const button = event.target.closest("[data-save]");
      if (!button) return;
      const id = button.dataset.save;
      const saved = savedScholarships();
      localStorage.setItem(savedKey, JSON.stringify(saved.includes(id) ? saved.filter((item) => item !== id) : [...saved, id]));
      renderScholarships();
    });
    window.addEventListener("storage", (event) => { if (event.key === savedKey) renderScholarships(); });
    window.addEventListener("scholarMatchedReady", loadScholarships);
  </script>
</body>
</html>
